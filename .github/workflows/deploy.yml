name: Deploy to GitHub Pages

# Baut die Seite bei jedem Push auf main neu und veröffentlicht sie.
# Dadurch reicht es, content/de.json bzw. content/en.json zu ändern —
# das fertige HTML wird automatisch erzeugt.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Liefert die tatsächliche Veröffentlichungs-Adresse. Bei einer eigenen
      # Domain ist base_path leer, bei einer Projektseite '/Repository-Name' —
      # ohne diese Angabe würden dort alle Verweise auf CSS und Bilder brechen.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Seite bauen
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
        run: node src/build.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
